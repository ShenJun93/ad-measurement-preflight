name: Bootstrap verified source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/source.tgz.b64'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify source archive
        shell: bash
        run: |
          base64 -d .bootstrap/source.tgz.b64 > /tmp/source.tgz
          echo 'cbbe886ba7dd9927e13bf58df5bed373ab5431e5081b69eee83fec3c75b64485  /tmp/source.tgz' | sha256sum -c -
      - name: Materialize verified tree
        shell: bash
        run: |
          tar -xzf /tmp/source.tgz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Verify before commit
        run: npm run verify
      - name: Commit canonical public source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: publish verified scanner source'
          git push
